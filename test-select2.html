<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Test Select2 Imágenes</title>
  <!-- jQuery primero -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <!-- Select2 CSS y JS -->
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <style>
    .select2-results__option .criatura-option-img {
      width: 28px;
      height: 28px;
      vertical-align: middle;
      margin-right: 10px;
      border-radius: 4px;
    }
    .select2-selection__rendered .criatura-option-img {
      width: 22px;
      height: 22px;
      vertical-align: middle;
      margin-right: 7px;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <h3>Selector de criatura con imagen (Select2)</h3>
  <select id="criatura" style="width: 300px;">
    <option value="">--Selecciona--</option>
    <option value="Caballo Negro" data-imagen="Caballonegro.png">Caballo Negro</option>
    <option value="Unicornio" data-imagen="Unicornio1.png">Unicornio</option>
    <option value="Tigre" data-imagen="Tigre.png">Tigre</option>
    <option value="Elefante" data-imagen="Elefante.png">Elefante</option>
    <option value="Dragon Dorado" data-imagen="Dragondorado.png">Dragon Dorado</option>
    <option value="Rinosaurio" data-imagen="Rinosaurio.png">Rinosaurio</option>
  </select>

  <script>
    function formatCriatura (state) {
      if (!state.id) return state.text;
      var img = $(state.element).data('imagen');
      var label = state.text;
      if (img) {
        return $('<span><img src="imagen/' + img + '" class="criatura-option-img"/> ' + label + '</span>');
      }
      return state.text;
    }
    $(document).ready(function() {
      $('#criatura').select2({
        templateResult: formatCriatura,
        templateSelection: formatCriatura,
        width: '100%'
      });
    });
  </script>
</body>
</html>
